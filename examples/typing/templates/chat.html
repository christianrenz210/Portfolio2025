<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Indicator Demo</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --bubble: #334155;
            --dot: #94a3b8;
            --text: #f1f5f9;
            --accent: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .chat {
            width: 360px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: var(--panel);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 85%;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bubble);
            color: var(--text);
        }

        /* Typing indicator (3 bouncing dots inside a bubble) */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 0.6rem 0.9rem;
        }

        .typing-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dot);
            animation: bounce 1.4s infinite ease-in-out;
        }

        /* Sequential delays */
        .typing-indicator .dot:nth-child(1) { animation-delay: 0s; }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        /* Bounce keyframes:
           Start & end low (translateY up = up here), peak in middle */
        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Hidden by default */
        .hidden { display: none; }

        .controls {
            display: flex;
            gap: 0.75rem;
        }

        .controls button {
            padding: 0.55rem 1.1rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .controls button:hover { opacity: 0.85; }
        .controls button.secondary { background: var(--bubble); }
    </style>
</head>
<body>

    <div class="chat">
        <div class="message user">What are your top 3 skills?</div>

        <!-- Typing indicator bubble -->
        <div id="typingBubble" class="message assistant typing-indicator hidden">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <div id="assistantReply" class="message assistant hidden">
            <strong>HTML</strong>, <strong>CSS</strong>, and <strong>JavaScript</strong>.
        </div>
    </div>

    <div class="controls">
        <button id="showBtn">Show typing</button>
        <button id="hideBtn" class="secondary">Hide</button>
    </div>

    <script>
        const typing = document.getElementById('typingBubble');
        const reply = document.getElementById('assistantReply');

        function showTyping() {
            typing.classList.remove('hidden');
            reply.classList.add('hidden');
        }

        function hideTyping() {
            typing.classList.add('hidden');
        }

        // Simulate: show typing, then reveal reply after 2s
        document.getElementById('showBtn').addEventListener('click', () => {
            showTyping();
            setTimeout(() => {
                hideTyping();
                reply.classList.remove('hidden');
            }, 2000);
        });

        document.getElementById('hideBtn').addEventListener('click', hideTyping);
    </script>

</body>
</html>
