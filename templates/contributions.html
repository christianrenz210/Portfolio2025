<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contributions</title>
    <style>
        :root {
            --level-0: rgba(255, 255, 255, 0.06);
            --level-1: rgba(0, 212, 255, 0.2);
            --level-2: rgba(0, 212, 255, 0.4);
            --level-3: rgba(0, 212, 255, 0.65);
            --level-4: #00D4FF;
            --text: #e6f7ff;
            --text-dim: rgba(230, 247, 255, 0.6);
            --accent: #00D4FF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent;
            color: var(--text);
            padding: 0;
        }
        .contrib-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 14px;
            padding: 18px 16px 14px;
            backdrop-filter: blur(10px);
        }
        .contrib-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .contrib-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .contrib-header h3 svg {
            color: var(--accent);
        }
        .contrib-total {
            font-size: 12.5px;
            color: var(--text-dim);
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .contrib-total strong {
            color: var(--accent);
            font-weight: 600;
        }
        .contrib-scroll {
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,212,255,.3) transparent;
        }
        .contrib-scroll::-webkit-scrollbar { height: 6px; }
        .contrib-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,212,255,.3);
            border-radius: 999px;
        }
        table.contrib-graph {
            border-spacing: 3px;
            border-collapse: separate;
            margin: 0 auto;
            width: auto;
        }
        .day {
            width: 11px;
            height: 11px;
            border-radius: 2.5px;
            cursor: pointer;
            transition: transform .1s ease;
            position: relative;
        }
        .day:hover { transform: scale(1.25); }
        .lvl-0 { background: var(--level-0); }
        .lvl-1 { background: var(--level-1); }
        .lvl-2 { background: var(--level-2); }
        .lvl-3 { background: var(--level-3); }
        .lvl-4 { background: var(--level-4); }
        .month-label {
            font-size: 9px;
            color: var(--text-dim);
            font-weight: 600;
        }
        .day-empty { background: transparent; }
        .legend {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            color: var(--text-dim);
            margin-top: 10px;
            justify-content: flex-end;
        }
        .legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
        .tooltip {
            position: absolute;
            background: #0c1215;
            border: 1px solid rgba(0,212,255,.25);
            color: #fff;
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity .12s ease;
            z-index: 50;
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(0,0,0,.5);
        }
        .tooltip.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="contrib-card">
        <div class="contrib-header">
            <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
                GitHub Contributions
            </h3>
            <span class="contrib-total"><strong>{{ total }}</strong> contributions in the last year</span>
        </div>

        <div class="contrib-scroll">
            <table class="contrib-graph" id="graph">
                <thead>
                    <tr id="months-row"></tr>
                </thead>
                <tbody id="body"></tbody>
            </table>
        </div>

        <div class="legend">
            Less
            <span class="swatch lvl-0"></span>
            <span class="swatch lvl-1"></span>
            <span class="swatch lvl-2"></span>
            <span class="swatch lvl-3"></span>
            <span class="swatch lvl-4"></span>
            More
        </div>
    </div>

    <div class="tooltip" id="tip"></div>

    <script>
        const DATA_GIT = {{ data | tojson }};

        function build() {
            const monthsRow = document.getElementById('months-row');
            const body = document.getElementById('body');

            // GitHub returns the cells grouped by weekday (all Sundays, then all Mondays...),
            // so sort them by date to rebuild the real grid.
            const sorted = DATA_GIT.slice().sort((a, b) =>
                a.date < b.date ? -1 : a.date > b.date ? 1 : 0
            );

            const first = new Date(sorted[0].date + 'T00:00:00');
            const last = new Date(sorted[sorted.length - 1].date + 'T00:00:00');

            // Start Sunday = the Sunday on or before the first date
            const startSunday = new Date(first);
            startSunday.setDate(first.getDate() - first.getDay());

            const MS = 86400000;
            const totalDays = Math.round((last - startSunday) / MS) + 1;
            const totalWeeks = Math.ceil(totalDays / 7);

            // Map every date to its grid position
            const cellMap = {};
            sorted.forEach(d => {
                const dt = new Date(d.date + 'T00:00:00');
                const dayOffset = Math.round((dt - startSunday) / MS);
                cellMap[d.date] = {
                    col: Math.floor(dayOffset / 7),
                    row: dt.getDay(),
                    level: d.level,
                    count: d.count,
                    date: d.date
                };
            });

            // Month labels (first column of each month)
            const monthTr = document.createElement('tr');
            for (let c = 0; c < totalWeeks; c++) {
                const colDate = new Date(startSunday);
                colDate.setDate(startSunday.getDate() + c * 7);
                const td = document.createElement('td');
                td.className = 'month-label';
                td.textContent = colDate.getDate() <= 7
                    ? colDate.toLocaleDateString('en-US', { month: 'short' })
                    : '';
                monthTr.appendChild(td);
            }
            monthsRow.appendChild(monthTr);

            // Day rows: 7 rows (Sun..Sat)
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            for (let r = 0; r < 7; r++) {
                const tr = document.createElement('tr');
                const label = document.createElement('td');
                label.className = 'month-label';
                label.textContent = dayNames[r];
                label.style.paddingRight = '3px';
                tr.appendChild(label);

                for (let c = 0; c < totalWeeks; c++) {
                    const td = document.createElement('td');
                    let cell = null;
                    for (const key in cellMap) {
                        const cm = cellMap[key];
                        if (cm.col === c && cm.row === r) { cell = cm; break; }
                    }
                    if (!cell) {
                        td.appendChild(document.createElement('span')).className = 'day-empty';
                        tr.appendChild(td);
                        continue;
                    }
                    const span = document.createElement('span');
                    span.className = 'day lvl-' + cell.level;
                    span.dataset.date = cell.date;
                    span.dataset.level = cell.level;
                    span.dataset.count = cell.count;
                    span.addEventListener('mouseenter', showTip);
                    span.addEventListener('mousemove', moveTip);
                    span.addEventListener('mouseleave', hideTip);
                    td.appendChild(span);
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
        }

        const tip = document.getElementById('tip');
        function showTip(e) {
            const d = e.target.dataset;
            let txt = d.count === 0
                ? 'No contributions on ' + fmtDate(d.date)
                : d.count + ' contribution' + (d.count > 1 ? 's' : '') + ' on ' + fmtDate(d.date);
            tip.textContent = txt;
            tip.classList.add('show');
        }
        function moveTip(e) {
            const rect = tip.getBoundingClientRect();
            tip.style.left = (e.pageX + 12) + 'px';
            tip.style.top = (e.pageY + 12) + 'px';
        }
        function hideTip() { tip.classList.remove('show'); }
        function fmtDate(s) {
            const d = new Date(s + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        build();
    </script>
</body>
</html>
